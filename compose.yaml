services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: CatalogManagerDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env with POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - catalogmanager_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d CatalogManagerDb"]
      interval: 5s
      timeout: 5s
      retries: 15

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=CatalogManagerDb;Username=postgres;Password=${POSTGRES_PASSWORD:?Create .env with POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:8085:8080"

volumes:
  catalogmanager_pgdata: