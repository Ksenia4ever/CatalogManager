name: C3 - Build, Test and Deploy to Azure

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore CatalogManager.slnx

      - name: Build solution (Release)
        run: dotnet build CatalogManager.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test UnitTests/CatalogManager.UnitTests.csproj --configuration Release --no-restore

      - name: Publish web application
        run: dotnet publish Frontend/CatalogManager.csproj --configuration Release --no-restore --output ./published-app

      - name: Upload published application
        uses: actions/upload-artifact@v4
        with:
          name: catalogmanager-published
          path: ./published-app/
          if-no-files-found: error

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Download published application
        uses: actions/download-artifact@v4
        with:
          name: catalogmanager-published
          path: ./published-app

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./published-app